name: ci
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

# The default token is read-only. Only the release job widens it.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA; the tag is only a comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: nginx/Dockerfile
      - name: Semgrep
        run: pip install semgrep==1.184.0 && semgrep scan --config p/ci --error
      - name: zizmor (the pipeline audits itself)
        run: pip install zizmor==1.32.0 && zizmor --offline .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt && pytest -q

  scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build -t frontdoor:ci nginx/
      # Install Trivy by pinned release binary (avoids nested unpinned actions under SHA policy).
      - name: Install Trivy
        run: |
          set -euo pipefail
          VER=0.58.1
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version
      - run: trivy image --severity HIGH,CRITICAL --exit-code 1 frontdoor:ci

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test, scan]
    permissions:
      contents: write   # create the release
      packages: write   # push the image to GHCR
      id-token: write   # OIDC identity for keyless signing
    env:
      IMG: ghcr.io/${{ github.repository }}/frontdoor:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t "$IMG" nginx/ && docker push "$IMG"
      # Syft + Cosign via pinned release binaries (same reason as Trivy above).
      - name: SBOM with Syft
        run: |
          set -euo pipefail
          VER=1.19.0
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${VER}/syft_${VER}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin syft
          syft "$IMG" -o spdx-json > sbom.spdx.json
      - name: Install Cosign
        run: |
          set -euo pipefail
          VER=2.4.1
          curl -sSfL -o cosign "https://github.com/sigstore/cosign/releases/download/v${VER}/cosign-linux-amd64"
          sudo install -m 0755 cosign /usr/local/bin/cosign
          cosign version
      - run: cosign sign --yes "$IMG"
      - name: Release with generated notes and the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" sbom.spdx.json
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
