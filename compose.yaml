# Single-node OpenSearch stack with Dashboards, Logstash and nginx front door.
# Image digests and host ports come from .env (CLAUDE.md, R-02).
services:
  opensearch:
    image: ${OPENSEARCH_IMAGE}
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  opensearch-dashboards:
    image: ${DASHBOARDS_IMAGE}
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      # Generated by make/secrets helper; disables multitenancy for the lab (R-02: file is gitignored).
      - ./config/opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    ports:
      - "${DASHBOARDS_PORT}:5601"
    depends_on:
      - opensearch



  logstash:
    image: ${LOGSTASH_IMAGE}
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./pipelines:/usr/share/logstash/pipeline:ro
      - ./data:/data:ro
      - ./enrich:/enrich:ro
    depends_on:
      - opensearch

  frontdoor:
    image: ${NGINX_IMAGE}
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/frontdoor.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/frontdoor.crt:/etc/nginx/certs/frontdoor.crt:ro
      - ./certs/frontdoor.key:/etc/nginx/certs/frontdoor.key:ro
    depends_on:
      - opensearch-dashboards

volumes:
  opensearch-data:
